<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Roger IA</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#7c5cff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Roger IA">
<style>
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; font-family: -apple-system, Segoe UI, Roboto, sans-serif; background: #0d0d0d; color: #f0f0f0; overscroll-behavior: none; }
body { display: flex; flex-direction: column; padding-top: env(safe-area-inset-top); padding-bottom: env(safe-area-inset-bottom); }
header { padding: 16px; background: #161616; border-bottom: 1px solid #2a2a2a; text-align: center; font-weight: 600; font-size: 18px; display: flex; align-items: center; justify-content: center; gap: 8px; }
header span { color: #7c5cff; }
#chat { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
.msg { max-width: 82%; padding: 10px 14px; border-radius: 14px; line-height: 1.4; white-space: pre-wrap; font-size: 15px; }
.user { align-self: flex-end; background: #7c5cff; color: white; border-bottom-right-radius: 4px; }
.agent { align-self: flex-start; background: #1f1f1f; border: 1px solid #2a2a2a; border-bottom-left-radius: 4px; }
.system { align-self: center; color: #888; font-size: 13px; }
form { display: flex; padding: 12px; background: #161616; border-top: 1px solid #2a2a2a; gap: 8px; }
input { flex: 1; padding: 12px 14px; border-radius: 24px; border: 1px solid #2a2a2a; background: #0d0d0d; color: white; font-size: 15px; }
button { padding: 12px 20px; border-radius: 24px; border: none; background: #7c5cff; color: white; font-weight: 600; font-size: 15px; }
button:disabled { opacity: 0.5; }
#install-banner { display: none; background: #1f1f1f; border-bottom: 1px solid #2a2a2a; padding: 10px 16px; font-size: 13px; text-align: center; color: #ccc; }
#install-banner button { margin-left: 8px; padding: 6px 14px; font-size: 13px; }
</style>
</head>
<body>
<div id="install-banner">Installe Roger IA sur ton écran d'accueil<button id="install-btn">Installer</button></div>
<header>🤖 <span>Roger IA</span></header>
<div id="chat"></div>
<form id="form">
<input id="input" type="text" placeholder="Écris un message..." autocomplete="off" />
<button type="submit" id="send">Envoyer</button>
</form>
<script>
const API_URL = "https://roger-ia-super.onrender.com/api/chat";
const USER_ID = "68849200-0f56-49b9-a49e-3d64c9cedd89";
const STORAGE_KEY = "roger-ia-conversation-id";
let CONVERSATION_ID = localStorage.getItem(STORAGE_KEY);
if (!CONVERSATION_ID) { CONVERSATION_ID = crypto.randomUUID(); localStorage.setItem(STORAGE_KEY, CONVERSATION_ID); }
const chat = document.getElementById("chat");
const form = document.getElementById("form");
const input = document.getElementById("input");
const sendBtn = document.getElementById("send");
function addMessage(text, role) {
const div = document.createElement("div");
div.className = "msg " + role;
div.textContent = text;
chat.appendChild(div);
chat.scrollTop = chat.scrollHeight;
}
addMessage("Bonjour Roger 👋 Je suis prêt à t'aider. Que veux-tu faire ?", "agent");
form.addEventListener("submit", async (e) => {
e.preventDefault();
const message = input.value.trim();
if (!message) return;
addMessage(message, "user");
input.value = "";
sendBtn.disabled = true;
addMessage("...", "system");
try {
const resp = await fetch(API_URL, {
method: "POST",
headers: { "Content-Type": "application/json" },
body: JSON.stringify({ userId: USER_ID, conversationId: CONVERSATION_ID, message })
});
const data = await resp.json();
chat.removeChild(chat.lastChild);
if (data.error) { addMessage("Erreur : " + data.error, "system"); }
else { addMessage(data.reply || "(réponse vide)", "agent"); }
} catch (err) {
chat.removeChild(chat.lastChild);
addMessage("Erreur de connexion : " + err.message, "system");
}
sendBtn.disabled = false;
});
if ("serviceWorker" in navigator) { navigator.serviceWorker.register("service-worker.js"); }
let deferredPrompt;
window.addEventListener("beforeinstallprompt", (e) => {
e.preventDefault();
deferredPrompt = e;
document.getElementById("install-banner").style.display = "block";
});
document.getElementById("install-btn").addEventListener("click", async () => {
if (!deferredPrompt) return;
deferredPrompt.prompt();
await deferredPrompt.userChoice;
deferredPrompt = null;
document.getElementById("install-banner").style.display = "none";
});
</script>
</body>
</html>
